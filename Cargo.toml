[workspace]
members = [
    ".",
    "src-tauri"
]

[package]
name = "animation-replace-roblox"
version = "0.1.0"
edition = "2024"
description = "High-performance bulk Roblox animation downloader, re-uploader, and place code replacer (CLI & GUI)"
authors = ["fin4j1881-blip", "shibahex (original author)", "Roblox Animation Replacer Contributors"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/fin4j1881-blip/animation-replacer-roblox-modified"
keywords = ["roblox", "animation", "tauri", "rbxl", "gamedev"]
categories = ["command-line-utilities", "development-tools", "gui"]


[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
url = "2.5.4"
rbx_dom_weak = "4.2.0"
rbx_binary = "3.0.0"
rbx_xml = "3.0.0"
ustr = "1.1.0"
rbx_types = "3.1.0"
regex = "1.11.1"
shellexpand = "3.1.1"
clap = { version = "4.1.13", features = ["derive"] }
reqwest = "0.12.21"
roboat = { git = "https://github.com/shibahex/roboat-extras.git", branch = "upload-animation-fix" }
#roboat = "0.36.0"
anyhow = "1.0.98"
indexmap = "2.10.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tracing-appender = "0.2.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
